
name: Build V Subbaiya Tiffins APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -oq VSubbaiyaTiffinsAndroid-1.zip

PROJECT_DIR=$(find . -type f -name "gradlew" -print -quit | xargs dirname)

if [ -z "$PROJECT_DIR" ]; then
  echo "Android project not found"
  find . -maxdepth 3 -type f | head -100
  exit 1
fi

echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
chmod +x "$PROJECT_DIR/gradlew"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VSubbaiyaTiffins-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
